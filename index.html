<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#071640"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="E-Smoker"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<title>E-Smoker Kalkulator</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#071640;--bgMid:#0a2d6e;--card:#0f4393;--cardLight:#1254a8;
    --accent:#1565c0;--accentDim:#4a90d9;
    --border:rgba(100,160,220,0.25);--borderBright:rgba(100,160,220,0.5);
    --white:#fff;--w80:rgba(255,255,255,0.8);--w50:rgba(255,255,255,0.5);--w30:rgba(255,255,255,0.3);
    --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--white);-webkit-tap-highlight-color:transparent;overflow:hidden;}
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;}
  .header{background:linear-gradient(135deg,#071a4a,var(--bg));padding:calc(14px + var(--safe-top)) 20px 12px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;justify-content:space-between;align-items:center;}
  .header-left{flex:1;}
  .header-date{font-size:10px;letter-spacing:3px;color:var(--white);text-transform:uppercase;margin-bottom:3px;}
  .header h1{font-size:20px;font-weight:900;color:var(--white);}
  
  .auth-btn{background:rgba(255,255,255,0.1);border:1px solid var(--borderBright);color:var(--white);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;}
  .auth-btn:hover{background:rgba(255,255,255,0.2);}
  .user-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid var(--white);}

  .tabs{background:linear-gradient(90deg,#0a2055,#0d47a1);border-bottom:1px solid var(--border);display:flex;flex-shrink:0;position:sticky;top:0;z-index:10;}
  .tab-btn{flex:1;padding:12px 2px 9px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--w50);border-bottom:3px solid transparent;transition:all 0.18s;}
  .tab-btn.active{color:var(--white);border-bottom-color:var(--accentDim);background:rgba(66,165,245,0.12);}
  .tab-icon{font-size:16px;display:block;margin-bottom:2px;}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(14px + var(--safe-bottom));}
  .tab-panel{display:none;}.tab-panel.active{display:block;}
  
  .card{background:linear-gradient(145deg,var(--card),var(--cardLight));border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:12px;}
  .card-title{font-size:15px;font-weight:800;color:var(--white);margin-bottom:14px;}
  .hero{background:linear-gradient(135deg,#071a4a,#0d47a1);border:1px solid var(--borderBright);border-radius:20px;padding:22px 20px;margin-bottom:12px;box-shadow:0 8px 32px rgba(13,71,161,0.5);}
  .hero-label{font-size:10px;letter-spacing:2px;color:var(--w50);text-transform:uppercase;}
  .hero-amount{font-size:42px;font-weight:900;letter-spacing:-2px;color:#7ec8f7;margin:4px 0 2px;line-height:1;}
  .hero-sub{font-size:13px;color:var(--w80);}
  
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .stat-card{background:linear-gradient(135deg,#1565c0,#0d47a1);border:1px solid var(--border);border-radius:14px;padding:12px 14px;}
  .stat-card.accent{border-color:var(--accentDim);}
  .stat-label{font-size:9px;color:var(--w50);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px;}
  .stat-value{font-size:20px;font-weight:900;color:var(--white);line-height:1;}
  .stat-card.accent .stat-value{color:#7ec8f7;}
  
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row-label{color:var(--w80);font-weight:500;}
  .row-value{font-weight:800;color:var(--white);}
  .row-value.hl{color:#7ec8f7;}
  
  .input-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
  .input-label{font-size:14px;color:var(--w80);font-weight:500;flex:1;padding-right:8px;}
  .input-field{width:150px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--borderBright);font-size:14px;font-weight:700;text-align:right;outline:none;background:rgba(255,255,255,0.12);color:var(--white);color-scheme:dark;}
  
  .cost-row{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--border);}
  .cost-label{font-size:12px;color:var(--w80);font-weight:600;min-width:70px;}
  .cost-date{flex:1;padding:6px;border-radius:8px;border:1.5px solid var(--borderBright);background:rgba(255,255,255,0.1);color:var(--white);font-size:11px;outline:none;color-scheme:dark;min-width:0;}
  .cost-val{width:78px;padding:6px;border-radius:8px;border:1.5px solid var(--borderBright);background:rgba(255,255,255,0.1);color:var(--white);font-size:13px;font-weight:700;text-align:right;outline:none;color-scheme:dark;}
  .cost-unit{font-size:11px;color:var(--w50);min-width:16px;}
  
  .bar-wrap{margin-bottom:12px;}
  .bar-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .bar-track{height:10px;background:rgba(255,255,255,0.1);border-radius:99px;}
  .bar-fill{height:100%;border-radius:99px;transition:width 0.6s;}
  
  .heater-item{padding:12px 0;border-bottom:1px solid var(--border);}
  .heater-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .heater-name{font-size:14px;font-weight:700;}
  .heater-days{font-size:11px;font-weight:600;}
  .heater-input{width:100%;padding:9px 14px;border-radius:10px;border:1.5px solid var(--borderBright);font-size:14px;font-weight:600;background:rgba(255,255,255,0.12);color:var(--white);outline:none;color-scheme:dark;}
  
  .info-box{background:rgba(66,165,245,0.1);border-radius:14px;padding:12px 16px;border:1px solid var(--border);margin-top:10px;}
  .info-title{font-size:12px;color:#7ec8f7;font-weight:700;}
  .info-text{font-size:13px;color:var(--w80);margin-top:4px;line-height:1.5;}
  
  .sync-status{font-size:11px;color:var(--w50);text-align:center;margin-top:8px;}
</style>

<!-- Firebase SDK -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="header-date" id="hdr-date"></div>
      <h1>💨 E-Smoker</h1>
    </div>
    <button class="auth-btn" id="auth-btn" onclick="toggleAuth()">
      <span>Prijava</span>
    </button>
  </div>
  
  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard"><span class="tab-icon">📊</span>Pregled</button>
    <button class="tab-btn" data-tab="costs"><span class="tab-icon">💸</span>Troškovi</button>
    <button class="tab-btn" data-tab="heaters"><span class="tab-icon">🔥</span>Grijači</button>
    <button class="tab-btn" data-tab="settings"><span class="tab-icon">⚙️</span>Podaci</button>
  </div>
  
  <div class="content">
    <!-- PREGLED -->
    <div class="tab-panel active" id="panel-dashboard">
      <div class="hero">
        <div class="hero-label">💰 Ukupno uštedeno</div>
        <div class="hero-amount" id="d-saved">+0.00 €</div>
        <div class="hero-sub" id="d-days">0 dana e-pušenja</div>
      </div>
      <div class="stat-grid">
        <div class="stat-card accent"><div class="stat-label">Ušteda / dan</div><div class="stat-value" id="d-saved-day">0.00 €</div></div>
        <div class="stat-card accent"><div class="stat-label">Ušteda / god.</div><div class="stat-value" id="d-saved-year">0 €</div></div>
        <div class="stat-card"><div class="stat-label">Da pušim / dan</div><div class="stat-value" id="d-would-day">0.00 €</div></div>
        <div class="stat-card"><div class="stat-label">Ml / dan</div><div class="stat-value" id="d-ml-day">—</div></div>
      </div>
      <div class="card">
        <div class="card-title">Usporedba troškova</div>
        <div class="bar-wrap">
          <div class="bar-header"><span style="color:var(--w80);font-weight:600">🚬 Da pušim</span><span style="font-weight:800" id="d-would-total">0.00 €</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar-smoke" style="width:100%;background:#4a90d9"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-header"><span style="color:var(--w80);font-weight:600">💨 E-cigarete</span><span style="font-weight:800" id="d-spent-total">0.00 €</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar-vape" style="width:0%;background:#7ec8f7"></div></div>
        </div>
      </div>
      <div class="sync-status" id="sync-msg">Podaci se spremaju lokalno. Prijavi se za Cloud čuvanje.</div>
    </div>

    <!-- TROŠKOVI -->
    <div class="tab-panel" id="panel-costs">
      <div class="card">
        <div class="card-title">💸 Unos troškova</div>
        <div class="cost-row">
          <span class="cost-label">E-cigarete</span>
          <input type="number" class="cost-val" id="c-hardware" step="0.01" value="0.00" oninput="saveData()"/>
          <span class="cost-unit">€</span>
        </div>
        <div class="cost-row">
          <span class="cost-label">Tekućine</span>
